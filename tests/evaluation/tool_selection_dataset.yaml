- id: workflow-list-genie-messages-for-conversations-direct
  category: single_tool
  tool_under_test: list_genie_messages_for_conversations
  tags:
  - positive
  - workflow
  user_prompt: 'Fetch up to 10 messages for each of these conversations in one batch: `01f10000000000000000000000000000`
