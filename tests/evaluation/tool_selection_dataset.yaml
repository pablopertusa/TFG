- id: workflow-get-genie-space-restore-job-run-direct
  category: single_tool
  tool_under_test: get_genie_space_restore_job_run
  tags:
  - positive
  - workflow
  user_prompt: Check the current status of Genie Space restore run `123456789012343` and include its output if complete.
  expected_tools:
  - get_genie_space_restore_job_run
  allowed_tools: []
  forbidden_tools:
