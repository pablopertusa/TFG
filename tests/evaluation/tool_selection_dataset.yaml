- id: workflow-get-genie-usage-metrics-query-result-direct
  category: single_tool
  tool_under_test: get_genie_usage_metrics_query_result
  tags:
  - positive
  - workflow
  user_prompt: Check whether usage-metrics statement `11111111-2222-4333-8444-555555555555` has finished and return
    its result if available.
  expected_tools:
  - get_genie_usage_metrics_query_result
  allowed_tools: []
  forbidden_tools:
  - start_genie_usage_metrics_query
  expected_tool_sequence:
  - get_genie_usage_metrics_query_result
  allowed_tool_sequences: []
  should_use_tool: true
