version: 4
name: mcp_workflow_tool_selection_50
description: Fifty curated English workflow cases for 18 MCP tools covering Atlan, conversations, usage, benchmarks,
  serialization, and restore flows.
review_status: pending_user_review
execution_policy:
  mode: synthetic_only
  real_tool_execution: false
  reason: Evaluate selection and arguments without API calls, SQL, Jobs, or mutations.
defaults:
  model: databricks-gpt-5-4-mini
  max_turns: 6
  model_retries: 0
  mcp_retries: 0
coverage_requirements_per_tool:
  positive: 1
identifiers:
  space_id: 01f00000000000000000000000000000
  conversation_id: 01f10000000000000000000000000000
  benchmark_run_id: 01f20000000000000000000000000000
  benchmark_result_id: 01f30000000000000000000000000000
  statement_id: 11111111-2222-4333-8444-555555555555
  serialization_run_id: 123456789012341
  restore_points_run_id: 123456789012342
  restore_run_id: 123456789012343
  table_identifier: eval_catalog.eval_schema.eval_orders
  snapshot_date: '2026-01-15'
tool_groups:
  atlan:
  - find_atlan_assets_by_databricks_table
  - get_atlan_context_for_databricks_table
  conversations_and_messages:
  - list_genie_space_conversations
  - list_genie_conversation_messages
  - list_genie_messages_for_conversations
  usage_metrics:
  - get_genie_usage_metrics
  - start_genie_usage_metrics_query
  - get_genie_usage_metrics_query_result
  benchmarks:
  - list_genie_benchmark_runs
  - get_genie_benchmark_run
  - list_genie_benchmark_run_results
  - get_genie_benchmark_result_details
  snapshots:
  - start_genie_serialization_job
  - get_genie_serialization_job_run
  - list_genie_space_restore_points
  - get_genie_restore_points_job_run
  - start_genie_space_restore_job
  - get_genie_space_restore_job_run
tool_inventory:
- find_atlan_assets_by_databricks_table
- get_atlan_context_for_databricks_table
- list_genie_space_conversations
- list_genie_conversation_messages
- list_genie_messages_for_conversations
- get_genie_usage_metrics
- start_genie_usage_metrics_query
- get_genie_usage_metrics_query_result
- list_genie_benchmark_runs
- get_genie_benchmark_run
- list_genie_benchmark_run_results
- get_genie_benchmark_result_details
- start_genie_serialization_job
- get_genie_serialization_job_run
- list_genie_space_restore_points
- get_genie_restore_points_job_run
- start_genie_space_restore_job
- get_genie_space_restore_job_run
tool_profiles:
  find_atlan_assets_by_databricks_table:
    purpose: Find Atlan assets that represent a Databricks table.
    closest_tool: get_atlan_context_for_databricks_table
    example_arguments:
      table_identifier: eval_catalog.eval_schema.eval_orders
      limit: 5
  get_atlan_context_for_databricks_table:
    purpose: Retrieve business context from Atlan for a Databricks table.
    closest_tool: find_atlan_assets_by_databricks_table
    example_arguments:
      table_identifier: eval_catalog.eval_schema.eval_orders
      limit: 1
  list_genie_space_conversations:
    purpose: List conversations in a Genie Space.
    closest_tool: list_genie_conversation_messages
    example_arguments:
      space_id: 01f00000000000000000000000000000
      include_all: false
      limit: 5
  list_genie_conversation_messages:
    purpose: List messages from one Genie conversation.
    closest_tool: list_genie_messages_for_conversations
    example_arguments:
      space_id: 01f00000000000000000000000000000
      conversation_id: 01f10000000000000000000000000000
      limit: 10
  list_genie_messages_for_conversations:
    purpose: List messages for several Genie conversations in one call.
    closest_tool: list_genie_conversation_messages
    example_arguments:
      space_id: 01f00000000000000000000000000000
      conversation_ids: &id001
      - 01f10000000000000000000000000000
      - 01f10000000000000000000000000001
      limit_per_conversation: 10
  get_genie_usage_metrics:
    purpose: Retrieve completed Genie usage metrics synchronously.
    closest_tool: start_genie_usage_metrics_query
    example_arguments:
      space_id: 01f00000000000000000000000000000
      lookback_days: 7
      timeout_seconds: 30
      poll_interval_seconds: 2
  start_genie_usage_metrics_query:
    purpose: Start an asynchronous Genie usage-metrics query.
    closest_tool: get_genie_usage_metrics
    example_arguments:
      space_id: 01f00000000000000000000000000000
      lookback_days: 7
  get_genie_usage_metrics_query_result:
    purpose: Retrieve the status and result of a started metrics statement.
    closest_tool: start_genie_usage_metrics_query
    example_arguments:
      statement_id: 11111111-2222-4333-8444-555555555555
  list_genie_benchmark_runs:
    purpose: List benchmark runs for a Genie Space.
    closest_tool: get_genie_benchmark_run
    example_arguments:
      space_id: 01f00000000000000000000000000000
      limit: 5
  get_genie_benchmark_run:
    purpose: Retrieve one Genie benchmark run.
    closest_tool: list_genie_benchmark_runs
    example_arguments:
      space_id: 01f00000000000000000000000000000
      run_id: 01f20000000000000000000000000000
  list_genie_benchmark_run_results:
    purpose: List result rows from one benchmark run.
    closest_tool: get_genie_benchmark_result_details
    example_arguments:
      space_id: 01f00000000000000000000000000000
      run_id: 01f20000000000000000000000000000
      limit: 5
  get_genie_benchmark_result_details:
    purpose: Retrieve the details of one benchmark result.
    closest_tool: list_genie_benchmark_run_results
    example_arguments:
      space_id: 01f00000000000000000000000000000
      run_id: 01f20000000000000000000000000000
      result_id: 01f30000000000000000000000000000
  start_genie_serialization_job:
    purpose: Prepare serialization of a Genie Space without approving execution.
    closest_tool: get_genie_serialization_job_run
    example_arguments:
      space_id: 01f00000000000000000000000000000
  get_genie_serialization_job_run:
    purpose: Check a serialization Job run.
    closest_tool: get_genie_space_restore_job_run
    example_arguments:
      run_id: 123456789012341
  list_genie_space_restore_points:
    purpose: List available restore points for a Genie Space.
    closest_tool: start_genie_space_restore_job
    example_arguments:
      space_id: 01f00000000000000000000000000000
      timeout_minutes: 1
      poll_interval_seconds: 5
  get_genie_restore_points_job_run:
    purpose: Check a Job run that discovers restore points.
    closest_tool: get_genie_space_restore_job_run
    example_arguments:
      run_id: 123456789012342
  start_genie_space_restore_job:
    purpose: Prepare a Genie Space restore without approving execution.
    closest_tool: list_genie_space_restore_points
    example_arguments:
      space_id: 01f00000000000000000000000000000
      snapshot_date: '2026-01-15'
  get_genie_space_restore_job_run:
    purpose: Check a Genie Space restore Job run.
    closest_tool: get_genie_restore_points_job_run
    example_arguments:
      run_id: 123456789012343
synthetic_results:
  find_atlan_assets_by_databricks_table:
    matches:
    - guid: eval-asset-guid
      qualified_name: eval_catalog.eval_schema.eval_orders
  get_atlan_context_for_databricks_table:
    combined_context_text: Synthetic business context for evaluation.
  list_genie_space_conversations:
    conversations:
    - conversation_id: 01f10000000000000000000000000000
    - conversation_id: 01f10000000000000000000000000001
  list_genie_conversation_messages:
    conversation_id: 01f10000000000000000000000000000
    messages:
    - message_id: eval-message-1
      content: Synthetic message
  list_genie_messages_for_conversations:
    results:
    - conversation_id: 01f10000000000000000000000000000
      messages: []
    - conversation_id: 01f10000000000000000000000000001
      messages: []
  get_genie_usage_metrics:
    succeeded: true
    metrics:
      total_questions: 7
  start_genie_usage_metrics_query:
    statement_id: 11111111-2222-4333-8444-555555555555
    done: false
    result_tool: get_genie_usage_metrics_query_result
  get_genie_usage_metrics_query_result:
    statement_id: 11111111-2222-4333-8444-555555555555
    done: true
    succeeded: true
    metrics:
      total_questions: 7
  list_genie_benchmark_runs:
    benchmark_runs:
    - id: 01f20000000000000000000000000000
      state: COMPLETED
  get_genie_benchmark_run:
    benchmark_run:
      id: 01f20000000000000000000000000000
      state: COMPLETED
  list_genie_benchmark_run_results:
    results:
    - id: 01f30000000000000000000000000000
      status: FAILED
  get_genie_benchmark_result_details:
    result:
      id: 01f30000000000000000000000000000
      status: FAILED
  start_genie_serialization_job:
    executed: false
    synthetic_run_id: 123456789012341
    confirmation_required: true
  get_genie_serialization_job_run:
    run:
      run_id: 123456789012341
      state: TERMINATED
  list_genie_space_restore_points:
    executed: false
    run_id: 123456789012342
    completed: false
    timed_out: true
    run:
      run_id: 123456789012342
      state: RUNNING
    output: null
  get_genie_restore_points_job_run:
    run:
      run_id: 123456789012342
      state: TERMINATED
    output:
      restore_points:
      - '2026-01-15'
  start_genie_space_restore_job:
    executed: false
    synthetic_run_id: 123456789012343
    confirmation_required: true
  get_genie_space_restore_job_run:
    run:
      run_id: 123456789012343
      state: TERMINATED
cases:
- id: workflow-find-atlan-assets-by-databricks-table-direct
  category: single_tool
  tool_under_test: find_atlan_assets_by_databricks_table
  tags:
  - positive
  - workflow
  user_prompt: Find up to 5 Atlan assets that represent `eval_catalog.eval_schema.eval_orders`. I only need the
    matching assets and GUIDs.
  expected_tools:
  - find_atlan_assets_by_databricks_table
  allowed_tools: []
  forbidden_tools:
  - get_atlan_context_for_databricks_table
  expected_tool_sequence:
  - find_atlan_assets_by_databricks_table
  allowed_tool_sequences: []
  should_use_tool: true
  expected_arguments:
    table_identifier:
      matcher: exact
      value: eval_catalog.eval_schema.eval_orders
    limit:
      matcher: exact
      value: 5
  expected_response_behavior: answer
- id: workflow-get-atlan-context-for-databricks-table-direct
  category: single_tool
  tool_under_test: get_atlan_context_for_databricks_table
  tags:
  - positive
  - workflow
  user_prompt: Give me the business description, glossary terms, and README context for `eval_catalog.eval_schema.eval_orders`
    from Atlan. Use at most one matching asset.
  expected_tools:
  - get_atlan_context_for_databricks_table
  allowed_tools: []
  forbidden_tools:
  - find_atlan_assets_by_databricks_table
  expected_tool_sequence:
  - get_atlan_context_for_databricks_table
  allowed_tool_sequences: []
  should_use_tool: true
  expected_arguments:
    table_identifier:
      matcher: exact
      value: eval_catalog.eval_schema.eval_orders
    limit:
      matcher: exact
      value: 1
  expected_response_behavior: answer
- id: workflow-list-genie-space-conversations-direct
  category: single_tool
  tool_under_test: list_genie_space_conversations
  tags:
  - positive
  - workflow
  user_prompt: Show me the 5 most recent conversations in Genie Space `01f00000000000000000000000000000`. I only
    need the conversation list for now.
  expected_tools:
  - list_genie_space_conversations
  allowed_tools: []
  forbidden_tools:
  - list_genie_conversation_messages
  expected_tool_sequence:
  - list_genie_space_conversations
  allowed_tool_sequences: []
  should_use_tool: true
  expected_arguments:
    space_id:
      matcher: exact
      value: 01f00000000000000000000000000000
    include_all:
      matcher: exact
      value: false
    limit:
      matcher: exact
      value: 5
  expected_response_behavior: answer
- id: workflow-list-genie-conversation-messages-direct
