  expected_tool_sequence:
  - list_genie_conversation_messages
  allowed_tool_sequences: []
  should_use_tool: true
  expected_arguments:
    space_id:
      matcher: exact
      value: 01f00000000000000000000000000000
    conversation_id:
      matcher: exact
      value: 01f10000000000000000000000000000
    limit:
      matcher: exact
      value: 10
